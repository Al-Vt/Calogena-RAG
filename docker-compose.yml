# Variables documentation: https://hub.docker.com/_/postgres

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    restart: always
    shm_size: 128mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql_initialization:/docker-entrypoint-initdb.d
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  adminer:
    image: adminer
    restart: always
    ports:
      - 8082:8080

volumes:
  postgres_data: